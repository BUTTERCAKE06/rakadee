<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ยืนยันอีเมล - Rakadee</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-container { max-width: 480px; margin: 48px auto; text-align: center; }
    .card-figma {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .logo-badge {
      width: 40px;
      height: 40px;
      background: #103ba1;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 700;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .btn-figma-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 44px;
      background: #1d4ed8;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s;
    }
    .btn-figma-primary:hover {
      background: #1e40af;
      color: #ffffff;
      text-decoration: none;
    }
    .btn-figma-secondary {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1.5px solid #e2e8f0;
      background: #ffffff;
      color: #0f172a;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-figma-secondary:hover:not(:disabled) {
      border-color: #1d4ed8;
      color: #1d4ed8;
      background: #eff6ff;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <div class="auth-container">
      <div class="card-figma">
        <div class="logo-badge">R</div>
        <h2 style="margin: 0; font-size: 24px; color: #0f172a;">ยืนยันที่อยู่อีเมล</h2>

        <div id="alert-box" class="alert hidden" style="margin-top: 16px;"></div>

        <div id="loading" style="padding: 24px; color: #64748b;">
          กำลังตรวจสอบความถูกต้องของโทเคน...
        </div>

        <div id="success-box" class="hidden" style="margin-top: 20px;">
          <p style="font-size: 15px; color: #334155; margin-bottom: 24px;">
            ที่อยู่อีเมลของคุณได้รับการยืนยันเรียบร้อยแล้ว
          </p>
          <a href="/pages/login.html" class="btn-figma-primary">เข้าสู่ระบบ</a>
        </div>

        <div id="resend-box" class="hidden" style="margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 16px;">
          <p class="muted" style="font-size: 13.5px;">หากโทเคนหมดอายุ คุณสามารถขอรับลิงก์ยืนยันใหม่ได้:</p>
          <button id="btn-resend" class="btn-figma-secondary" style="margin-top: 8px;">ส่งอีเมลยืนยันอีกครั้ง</button>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const alertBox = document.getElementById('alert-box');
    const loading = document.getElementById('loading');
    const successBox = document.getElementById('success-box');
    const resendBox = document.getElementById('resend-box');
    const btnResend = document.getElementById('btn-resend');

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = isError ? 'alert alert-error' : 'alert alert-success';
      alertBox.classList.remove('hidden');
    }

    async function verify() {
      if (!token) {
        loading.classList.add('hidden');
        showAlert('ไม่พบโทเคนยืนยันอีเมล หรือลิงก์ไม่ถูกต้อง');
        resendBox.classList.remove('hidden');
        return;
      }

      try {
        const res = await api.get(`/auth/verify-email?token=${encodeURIComponent(token)}`);
        loading.classList.add('hidden');
        showAlert('ยืนยันอีเมลสำเร็จ!', false);
        successBox.classList.remove('hidden');
      } catch (err) {
        loading.classList.add('hidden');
        showAlert(err.message || 'โทเคนยืนยันอีเมลไม่ถูกต้องหรือหมดอายุ');
        resendBox.classList.remove('hidden');
      }
    }

    btnResend.addEventListener('click', async () => {
      btnResend.disabled = true;
      btnResend.textContent = 'กำลังส่ง...';
      try {
        await api.post('/auth/verify-email/resend');
        showAlert('ระบบได้ส่งอีเมลยืนยันฉบับใหม่ไปให้แล้ว กรุณาตรวจสอบกล่องข้อความ', false);
      } catch (err) {
        showAlert(err.message || 'กรุณาเข้าสู่ระบบก่อนขอส่งอีเมลยืนยันใหม่');
      } finally {
        btnResend.disabled = false;
        btnResend.textContent = 'ส่งอีเมลยืนยันอีกครั้ง';
      }
    });

    verify();
  </script>
</body>
</html>
