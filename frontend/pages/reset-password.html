<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตั้งรหัสผ่านใหม่ - Rakadee</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-container { max-width: 440px; margin: 48px auto; }
    .card-figma {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .logo-badge {
      width: 40px;
      height: 40px;
      background: #103ba1;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 700;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 6px;
      display: block;
    }
    .input-figma {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
      color: #0f172a;
      outline: none;
      transition: all 0.15s ease;
      background: #ffffff;
      box-sizing: border-box;
    }
    .input-figma:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }
    .helper-text {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
      display: block;
    }
    .btn-figma-primary {
      width: 100%;
      height: 44px;
      background: #1d4ed8;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-figma-primary:hover:not(:disabled) {
      background: #1e40af;
    }
    .btn-figma-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <div class="auth-container">
      <div class="card-figma">
        <div style="text-align: center; margin-bottom: 24px;">
          <div class="logo-badge">R</div>
          <h2 style="margin: 0; font-size: 24px; color: #0f172a;">ตั้งรหัสผ่านใหม่</h2>
          <p class="muted" style="margin: 6px 0 0; font-size: 14px;">กรุณากำหนดรหัสผ่านใหม่สำหรับเข้าใช้งานระบบ</p>
        </div>

        <div id="alert-box" class="alert hidden"></div>

        <form id="reset-form">
          <div class="form-group">
            <label for="password">รหัสผ่านใหม่</label>
            <input type="password" id="password" class="input-figma" required placeholder="อย่างน้อย 8 ตัวอักษร (A-Z, a-z, 0-9)">
            <span class="helper-text">ต้องมีความยาวอย่างน้อย 8 ตัวอักษร ประกอบด้วยพิมพ์ใหญ่ พิมพ์เล็ก และตัวเลข</span>
          </div>

          <div class="form-group" style="margin-top: 14px;">
            <label for="password-confirm">ยืนยันรหัสผ่านใหม่</label>
            <input type="password" id="password-confirm" class="input-figma" required placeholder="พิมพ์รหัสผ่านใหม่อีกครั้ง">
          </div>

          <div style="margin-top: 24px;">
            <button type="submit" class="btn-figma-primary" id="btn-submit">
              บันทึกรหัสผ่านใหม่
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const form = document.getElementById('reset-form');
    const alertBox = document.getElementById('alert-box');
    const btnSubmit = document.getElementById('btn-submit');

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = isError ? 'alert alert-error' : 'alert alert-success';
      alertBox.classList.remove('hidden');
    }

    if (!token) {
      showAlert('ไม่พบโทเคนสำหรับการรีเซ็ตรหัสผ่าน หรือลิงก์ไม่ถูกต้อง');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('password-confirm').value;

      if (password.length < 8 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password)) {
        showAlert('รหัสผ่านต้องมีความยาวอย่างน้อย 8 ตัวอักษร และประกอบด้วยตัวพิมพ์ใหญ่ พิมพ์เล็ก และตัวเลข');
        return;
      }

      if (password !== confirm) {
        showAlert('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'กำลังบันทึก...';

      try {
        const res = await api.post('/auth/password/reset', { token, password });
        showAlert(res.message || 'ตั้งรหัสผ่านใหม่สำเร็จ กำลังพาไปหน้าเข้าสู่ระบบ...', false);
        setTimeout(() => {
          location.href = '/pages/login.html';
        }, 1500);
      } catch (err) {
        showAlert(err.message || 'โทเคนหมดอายุหรือไม่ถูกต้อง กรุณาทำรายการใหม่อีกครั้ง');
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'บันทึกรหัสผ่านใหม่';
      }
    });
  </script>
</body>
</html>
