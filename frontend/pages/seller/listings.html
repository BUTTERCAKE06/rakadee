<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สินค้าของฉัน — Rakadee</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/qa.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="container account-layout" style="padding-top:24px;">
    <aside class="account-nav" id="seller-nav"></aside>

    <section>
      <div class="qa-title-row" style="justify-content:space-between;">
        <h1>สินค้าของฉัน</h1>
        <a class="btn btn-accent" href="/pages/seller/listing-form.html">+ ลงสินค้าใหม่</a>
      </div>
      <div id="alert-area" aria-live="polite"></div>

      <div class="qa-pill-tabs" id="tabs" role="tablist" aria-label="กรองสถานะสินค้า">
        <button type="button" data-status="" class="active">ทั้งหมด</button>
        <button type="button" data-status="draft">ฉบับร่าง</button>
        <button type="button" data-status="pending_review">รอตรวจสอบ</button>
        <button type="button" data-status="rejected">ไม่อนุมัติ</button>
        <button type="button" data-status="active">กำลังประมูล</button>
        <button type="button" data-status="ended">สิ้นสุด</button>
        <button type="button" data-status="cancelled">ยกเลิก</button>
      </div>

      <div id="banners"></div>

      <div class="qa-table-wrap">
        <table>
          <thead><tr><th>สินค้า</th><th>ราคาเริ่มต้น</th><th>ระยะเวลา</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
          <tbody id="rows"><tr><td colspan="5" class="empty">กำลังโหลด...</td></tr></tbody>
        </table>
      </div>
      <div class="qa-pagination" id="pagination"></div>
    </section>
  </main>

  <footer class="qa-footer">
    <div class="container">
      <div>RAKADEE — แพลตฟอร์มประมูลสินค้าออนไลน์ มีระบบพักเงินกลาง (Escrow)</div>
      <div class="links"><a href="/pages/terms.html">เงื่อนไขการให้บริการ</a> · <a href="/pages/terms.html#privacy">นโยบายความเป็นส่วนตัว (PDPA)</a> · <a href="/pages/help.html">ช่วยเหลือ</a></div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/seller/seller-nav.js"></script>
  <script src="/js/qa-common.js"></script>
  <script src="/js/seller/listings.js"></script>
</body>
</html>
