<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลืมรหัสผ่าน - Rakadee</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-container { max-width: 440px; margin: 48px auto; }
    .card-figma {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .logo-badge {
      width: 40px;
      height: 40px;
      background: var(--color-primary-dark);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-surface);
      font-weight: 700;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 6px;
      display: block;
    }
    .input-figma {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--color-border);
      border-radius: 8px;
      font-size: 15px;
      color: var(--color-text);
      outline: none;
      transition: all 0.15s ease;
      background: var(--color-surface);
      box-sizing: border-box;
    }
    .input-figma:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }
    .btn-figma-primary {
      width: 100%;
      height: 44px;
      background: var(--color-primary);
      color: var(--color-surface);
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-figma-primary:hover:not(:disabled) {
      background: var(--color-primary-dark);
    }
    .btn-figma-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <div class="auth-container">
      <div class="card-figma">
        <div style="text-align: center; margin-bottom: 24px;">
          <div class="logo-badge">R</div>
          <h2 style="margin: 0; font-size: 24px; color: var(--color-text);">ลืมรหัสผ่าน</h2>
          <p class="muted" style="margin: 6px 0 0; font-size: 14px;">ระบุอีเมลที่ใช้ลงทะเบียน ระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้ทางอีเมล</p>
        </div>

        <div id="alert-box" class="alert hidden"></div>

        <form id="forgot-form">
          <div class="form-group">
            <label for="email">อีเมลที่ลงทะเบียน</label>
            <input type="email" id="email" class="input-figma" required placeholder="เช่น somchai@example.com">
          </div>

          <div style="margin-top: 24px;">
            <button type="submit" class="btn-figma-primary" id="btn-submit">
              ส่งลิงก์รีเซ็ตรหัสผ่าน
            </button>
          </div>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--color-muted); border-top: 1px solid var(--color-border); padding-top: 16px;">
          จำรหัสผ่านได้แล้ว? <a href="/pages/login.html" style="color: var(--color-primary); font-weight: 500;">กลับไปหน้าเข้าสู่ระบบ</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const alertBox = document.getElementById('alert-box');
    const btnSubmit = document.getElementById('btn-submit');

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = isError ? 'alert alert-error' : 'alert alert-success';
      alertBox.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'กำลังดำเนินการ...';

      try {
        const res = await api.post('/auth/password/forgot', { email });
        showAlert(res.message || 'หากอีเมลนี้มีอยู่ในระบบ ระบบได้ส่งลิงก์รีเซ็ตรหัสผ่านไปแล้ว กรุณาตรวจสอบกล่องจดหมายของคุณ', false);
        form.reset();
      } catch (err) {
        showAlert(err.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'ส่งลิงก์รีเซ็ตรหัสผ่าน';
      }
    });
  </script>
</body>
</html>
