<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ตรวจร้านค้า — Admin | Rakadee</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="stylesheet" href="/css/qa.css" />
</head>
<body class="admin-page">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>

  <div class="admin-main">
    <div class="admin-topbar" id="admin-topbar" data-title="ตรวจร้านค้า"></div>

    <main class="admin-content">
      <p class="muted" style="margin-top:0;"></p>
      <div id="alert-area"></div>

      <div class="tabs" id="tabs" role="tablist">
        <button type="button" data-status="pending" class="active">รออนุมัติ</button>
        <button type="button" data-status="approved">อนุมัติแล้ว</button>
        <button type="button" data-status="rejected">ไม่อนุมัติ</button>
      </div>

      <form class="qa-toolbar" id="search-form" role="search">
        <input type="search" id="search-input" placeholder="ค้นหาชื่อร้าน / username / อีเมล" aria-label="ค้นหาคำขอ" />
        <button type="submit" class="btn">ค้นหา</button>
      </form>

      <div class="qa-table-wrap">
        <table>
          <thead>
            <tr><th>ร้าน</th><th>ผู้สมัคร</th><th>จังหวัด</th><th>ยืนยันตัวตน</th><th>อายุบัญชี</th><th>ความผิด</th><th>ยื่นเมื่อ</th><th></th></tr>
          </thead>
          <tbody id="rows"><tr><td colspan="8" class="empty">กำลังโหลด...</td></tr></tbody>
        </table>
      </div>
      <div class="qa-pagination" id="pagination"></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script src="/js/qa-common.js"></script>
  <script src="/js/admin/seller-applications.js"></script>
</body>
</html>
