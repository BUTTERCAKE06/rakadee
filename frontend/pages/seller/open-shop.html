<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เปิดร้านขาย — Rakadee</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="container" style="max-width:560px;">
    <h1 style="margin-bottom:4px;">เปิดร้านขาย</h1>
    <p class="muted" style="margin-top:0;margin-bottom:24px;">กรอกข้อมูลร้านค้าของคุณ เมื่อยืนยันแล้วจะได้รับสิทธิ์ผู้ขายทันที</p>

    <div id="alert-area"></div>

    <form id="form-open-shop" class="card" novalidate>
      <div class="form-group">
        <label for="shopName">ชื่อร้านค้า <span style="color:var(--color-danger)">*</span></label>
        <input type="text" id="shopName" name="shopName" maxlength="100" placeholder="เช่น ร้านการ์ดมังกร" />
        <span class="field-error" id="err-shopName"></span>
      </div>

      <div class="form-group">
        <label for="shopDescription">รายละเอียดร้าน</label>
        <textarea id="shopDescription" name="shopDescription" rows="4" maxlength="500"
          placeholder="แนะนำร้านของคุณให้ผู้ซื้อรู้จัก..."></textarea>
        <span class="field-error" id="err-shopDescription"></span>
      </div>

      <div class="form-group">
        <label for="originProvince">จังหวัดต้นทาง <span style="color:var(--color-danger)">*</span></label>
        <select id="originProvince" name="originProvince">
          <option value="">— เลือกจังหวัด —</option>
        </select>
        <span class="field-error" id="err-originProvince"></span>
      </div>

      <div style="display:flex;gap:8px;margin-top:8px;">
        <button type="submit" class="btn btn-primary" id="btn-submit">เปิดร้านขาย</button>
        <a href="/" class="btn">ยกเลิก</a>
      </div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/seller/open-shop.js"></script>
</body>
</html>
