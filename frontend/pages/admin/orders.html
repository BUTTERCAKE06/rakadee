<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คำสั่งซื้อทั้งหมด — Admin | Rakadee</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/orders.css">
  <style>
    .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
    .filters .form-group { margin: 0; }
    .filters input[type=search] { min-width: 260px; }
    tbody tr { cursor: pointer; }
    tbody tr:hover td { background: var(--color-bg); }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="admin-page">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>

  <div class="admin-main">
    <div class="admin-topbar" id="admin-topbar" data-title="คำสั่งซื้อทั้งหมด"></div>

    <main class="admin-content">
      <div id="list-view">
        <div id="alert"></div>
        <form class="filters" id="filters">
          <div class="form-group">
            <label for="q">ค้นหา</label>
            <input type="search" id="q" name="q" placeholder="รหัส ORD / ชื่อสินค้า / ผู้ซื้อ / ผู้ขาย">
          </div>
          <div class="form-group">
            <label for="status">สถานะ</label>
            <select id="status" name="status">
              <option value="">ทั้งหมด</option>
              <option value="pending_payment">รอชำระเงิน</option>
              <option value="awaiting_shipment">รอจัดส่ง</option>
              <option value="shipped">อยู่ระหว่างจัดส่ง</option>
              <option value="completed">สำเร็จ</option>
              <option value="disputed">มีข้อพิพาท</option>
              <option value="cancelled">ยกเลิก</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">ค้นหา</button>
          <button type="reset" class="btn">ล้าง</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>คำสั่งซื้อ</th><th>สินค้า</th><th>ผู้ซื้อ</th><th>ผู้ขาย</th><th>ยอดรวม</th><th>สถานะ</th><th>สร้างเมื่อ</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </div>
      <div id="detail-view" hidden></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script src="/js/order-view.js"></script>
  <script src="/js/admin/orders.js"></script>
</body>
</html>
