<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สินค้าของฉัน — Rakadee</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .tab-bar { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:20px; border-bottom:2px solid var(--color-border); padding-bottom:0; }
    .tab-bar button { background:none; border:none; padding:10px 16px; cursor:pointer; font:inherit; color:var(--color-muted); border-bottom:2px solid transparent; margin-bottom:-2px; border-radius:0; }
    .tab-bar button.active { color:var(--color-primary); border-bottom-color:var(--color-primary); font-weight:600; }
    .tab-bar button:hover:not(.active) { color:var(--color-text); }

    .listing-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
    .listing-card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius); overflow:hidden; }
    .listing-card img { width:100%; height:160px; object-fit:cover; background:var(--color-bg); display:block; }
    .listing-card .img-placeholder { width:100%; height:160px; background:var(--color-bg); display:flex; align-items:center; justify-content:center; color:var(--color-muted); font-size:40px; }
    .listing-card .body { padding:12px; }
    .listing-card .title { font-weight:600; margin:0 0 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .listing-card .meta { color:var(--color-muted); font-size:13px; margin:0; }
    .listing-card .price { color:var(--color-primary); font-weight:700; font-size:20px; margin:0; line-height:1.3; }
    .listing-card .price-row { display:flex; justify-content:space-between; align-items:flex-end; gap:8px; }
    .listing-card .price-block { display:flex; flex-direction:column; min-width:0; }
    .listing-card .bids { color:var(--color-muted); font-size:13px; }
    .listing-card .status-col { display:flex; flex-direction:column; align-items:flex-end; gap:6px; margin-left:auto; flex-shrink:0;  }
    .listing-card .countdown { display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; }
    .listing-card .reject-reason { background:#fef2f2; border:1px solid var(--color-danger); border-radius:6px; padding:8px; font-size:13px; color:var(--color-danger); margin:8px 0; }
    .listing-card .actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; align-items:center; }
    .listing-card .actions .btn-cancel { margin-left:auto; }

    .empty-state { text-align:center; padding:60px 20px; color:var(--color-muted); }
    .empty-state .icon { font-size:48px; margin-bottom:12px; }

    .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <div class="top-bar">
      <h1 style="margin:0;">สินค้าของฉัน</h1>
      <a href="/pages/seller/listing-form.html" class="btn btn-accent" style="font-size: 11px;">+ ลงสินค้าใหม่</a>
    </div>

    <div id="alert-area"></div>

    <div class="tab-bar" id="tab-bar">
      <button data-status="draft" class="active">ฉบับร่าง</button>
      <button data-status="pending_review">รอตรวจสอบ</button>
      <button data-status="rejected">ไม่อนุมัติ</button>
      <button data-status="active">กำลังประมูล</button>
      <button data-status="ended">สิ้นสุดแล้ว</button>
      <button data-status="cancelled">ยกเลิก</button>
    </div>

    <div id="listing-container">
      <div class="empty-state"><div class="icon">📦</div><p>กำลังโหลด...</p></div>
    </div>

    <div id="pagination" style="margin-top:24px;display:flex;gap:8px;justify-content:center;"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/seller/listings.js"></script>
</body>
</html>
