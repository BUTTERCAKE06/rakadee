<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>บันทึกการทำงาน — Admin | Rakadee</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
    .filters .form-group { margin: 0; }
    .table-wrap { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); overflow-x: auto; }
    .table-wrap table { margin: 0; }
    td code { font-size: 13px; }
    .detail { color: var(--color-muted); font-size: 13px; overflow-wrap: anywhere; }
    .pager { display: flex; justify-content: center; gap: 8px; margin-top: 16px; align-items: center; }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="admin-page">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>

  <div class="admin-main">
    <div class="admin-topbar" id="admin-topbar" data-title="บันทึกการทำงาน (Audit Log)"></div>

    <main class="admin-content">
      <div id="alert"></div>
      <p class="muted" id="scope"></p>

      <form class="filters" id="filters">
        <div class="form-group" id="admin-filter" hidden>
          <label for="adminId">แอดมิน</label>
          <select id="adminId" name="adminId"><option value="">ทั้งหมด</option></select>
        </div>
        <div class="form-group">
          <label for="action">การกระทำ</label>
          <select id="action" name="action"><option value="">ทั้งหมด</option></select>
        </div>
        <div class="form-group">
          <label for="from">ตั้งแต่วันที่</label>
          <input type="date" id="from" name="from">
        </div>
        <div class="form-group">
          <label for="to">ถึงวันที่</label>
          <input type="date" id="to" name="to">
        </div>
        <button type="submit" class="btn btn-primary">กรอง</button>
        <button type="reset" class="btn">ล้างตัวกรอง</button>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>วัน-เวลา</th><th>แอดมิน</th><th>การกระทำ</th><th>เป้าหมาย</th><th>IP</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script src="/js/admin/audit-logs.js"></script>
</body>
</html>
