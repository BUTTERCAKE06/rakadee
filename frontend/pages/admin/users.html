<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จัดการผู้ใช้ — Admin | Rakadee</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="stylesheet" href="/css/qa.css" />
</head>
<body class="admin-page">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>

  <div class="admin-main">
    <div class="admin-topbar" id="admin-topbar" data-title="จัดการผู้ใช้"></div>

    <main class="admin-content">
      <div id="alert-area" aria-live="polite"></div>

      <!-- แท็บ: รายชื่อผู้ใช้ (ภาพ A6) / บิดน่าสงสัย (ข้อ 7.3, API 10.6–10.7 — รวมจากหน้าแยกเดิม) -->
      <div class="tabs" id="main-tabs" role="tablist">
        <button type="button" role="tab" data-tab="users" class="active" aria-selected="true">ผู้ใช้</button>
        <button type="button" role="tab" data-tab="flags" aria-selected="false">บิดน่าสงสัย <span class="qa-pill is-danger" id="flag-count" hidden></span></button>
      </div>

      <section id="tab-flags" hidden>
        <p class="muted" style="margin-top:0;">ถ้าผู้บิดใช้ IP เดียวกับผู้ขาย หรือบิดร้านเดิม ≥ 5 รายการใน 7 วัน  — ระบบไม่ลงโทษอัตโนมัติ กดชื่อผู้ใช้เพื่อดูโปรไฟล์และระงับ/แบน</p>
        <div class="qa-pill-tabs" id="flag-tabs" aria-label="กรองการตรวจ">
          <button type="button" data-reviewed="false" class="active">ยังไม่ตรวจ</button>
          <button type="button" data-reviewed="true">ตรวจแล้ว</button>
          <button type="button" data-reviewed="all">ทั้งหมด</button>
        </div>
        <div class="qa-table-wrap">
          <table>
            <thead><tr><th>เหตุผล</th><th>สินค้า</th><th>ผู้บิด</th><th>ผู้ขาย</th><th>พบเมื่อ</th><th></th></tr></thead>
            <tbody id="flag-rows"><tr><td colspan="6" class="empty">กำลังโหลด...</td></tr></tbody>
          </table>
        </div>
        <div class="qa-pagination" id="flag-pagination"></div>
      </section>

      <div class="qa-grid-main is-list-panel" id="tab-users">
        <section>
          <form class="qa-toolbar" id="search-form" role="search">
            <input type="search" id="search-input" placeholder="ค้นหาชื่อ / อีเมล / เบอร์โทร" aria-label="ค้นหาผู้ใช้" />
            <span class="qa-chips" id="filters" style="margin:0;" aria-label="กรองสถานะ (กดซ้ำเพื่อยกเลิก)">
              <button type="button" class="qa-pill is-success" data-status="active">Active</button>
              <button type="button" class="qa-pill is-warning" data-status="restricted" title="เพิ่มจากภาพ: สถานะถูกจำกัด (D-03)">Restricted</button>
              <button type="button" class="qa-pill is-warning" data-status="suspended">Suspended</button>
              <button type="button" class="qa-pill is-danger" data-status="banned">Banned</button>
            </span>
          </form>

          <div class="qa-table-wrap">
            <table>
              <thead><tr><th>ชื่อ</th><th>อีเมล</th><th>เบอร์</th><th>บัตร ปชช.</th><th>สถานะ</th></tr></thead>
              <tbody id="rows"><tr><td colspan="5" class="empty">กำลังโหลด...</td></tr></tbody>
            </table>
          </div>
          <div class="qa-pagination" id="pagination"></div>
        </section>

        <aside class="card" id="panel">
          <p class="muted" style="margin:0;">เลือกผู้ใช้จากตารางเพื่อดูโปรไฟล์และจัดการบัญชี</p>
        </aside>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script src="/js/qa-common.js"></script>
  <script src="/js/admin/users.js"></script>
</body>
</html>
