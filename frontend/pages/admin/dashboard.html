<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ภาพรวมระบบ — Admin | Rakadee</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .dash-section { margin-top: 24px; }
    .dash-section h2 { font-size: 18px; margin: 0 0 12px; }
    .updated { color: var(--color-muted); font-size: 13px; }
  </style>
</head>
<body class="admin-page">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>

  <div class="admin-main">
    <div class="admin-topbar" id="admin-topbar" data-title="ภาพรวมระบบ"></div>

    <main class="admin-content">
      <div id="alert"></div>
      <p class="updated" id="updated" aria-live="polite"></p>

      <section class="dash-section">
        <h2>งานที่รอแอดมิน</h2>
        <div class="stat-grid" id="todo"></div>
      </section>
      <section class="dash-section">
        <h2>ผู้ใช้และสินค้า</h2>
        <div class="stat-grid" id="users"></div>
      </section>
      <section class="dash-section">
        <h2>คำสั่งซื้อและเงินหมุนเวียน</h2>
        <div class="stat-grid" id="orders"></div>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-shell.js"></script>
  <script src="/js/admin/dashboard.js"></script>
</body>
</html>
